<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note Saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h3>Quick Notes Saver App</h3>
        <a href="notes.html">View saved notes</a>
        <form id="notes-form">
            <div>
                <label for="noteTitle">Note Title : </label>
                <input type="text" id="noteTitle" placeholder="Enter note title" required>
            </div>
            <div>
                <label for="noteContent">Note Content : </label>
                <textarea placeholder="Write your note here" id="noteContent"></textarea>
            </div>

            <button type="submit">Save Note</button>

            <p id="message"></p>
        </form>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
